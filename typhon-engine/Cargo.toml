[package]
name = "typhon-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "typhon_engine"
path = "src/lib.rs"

[[bin]]
name = "typhon-engine"
path = "src/main.rs"

[[bin]]
name = "hydranos"
path = "src/hydra/main.rs"

# The updater is a SEPARATE binary, not a subcommand: Windows locks a running
# program's own file, so hydranos.exe cannot overwrite itself. This one waits
# for the daemon to exit first.
[[bin]]
name = "hydranos-update"
path = "src/update/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
# gzip on the SSE stream. Hydration is ~250 MB of JSON at 300k torrents and a
# browser will not sit through that uncompressed; 3.x gzips the same stream.
tower-http = { version = "0.6", features = ["compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
axum = { version = "0.7", features = ["multipart"] }
async-stream = "0.3"
sha1 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = { version = "0.5", optional = true }
lru = "0.12"
dashmap = { version = "6", features = ["raw-api"] }
futures = "0.3"
tokio-socks = "0.5"
libc = "0.2"
# cookies: the qBittorrent Web API hands out a session cookie at login and
# expects it on every later call. json: the same API answers in JSON.
# The admin password is stored as a bcrypt hash by 3.x; /api/login has to
# verify against that same hash, so an upgrade keeps the account.
bcrypt = "0.15"

# hydranos-update: verify the published SHA-256 before replacing anything, and
# read the release archive of either platform. sha1 is already here for info
# hashes and is NOT the same algorithm.
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

# Already in the tree as a transitive dependency, so naming it costs no build
# time. Workflow conditions offer a "matches" operator and hand-rolling one
# would be a worse regex engine with the same surface.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "cookies", "json", "multipart", "blocking"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
librqbit-utp = "0.7"
# sha1-ring, not the default sha1-crypto-hash: the latter pulls OpenSSL in as a
# shared library, which made the release tarball unusable on any host whose
# libssl is older than the build runner's. ring compiles in.
librqbit-dht = { version = "5", default-features = false, features = ["sha1-ring"] }
parking_lot = "0.12"
# Durable per-torrent state. "bundled" compiles SQLite in rather than linking
# the system library, for the same reason sha1-ring is preferred over the
# OpenSSL-backed hash above: a release tarball must not depend on whatever
# libsqlite3 happens to be installed on the host.
rusqlite = { version = "0.32", features = ["bundled"] }

# jemalloc (heap profiling of the Linux leak) and nix are Unix-only; the
# system allocator is used on Windows.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "0.5", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.5", features = ["use_std"] }
nix = { version = "0.29", features = ["fs"] }

# Win32 for the seven system primitives Unix gets from libc: volume identity,
# hard-link count, free space, page size, working set, local time and the
# network-filesystem test. See src/hydra/platform.rs.
[target.'cfg(windows)'.dependencies]
# The tray icon is built from web/static/hydra-logo.png at run time, as the Go
# tray did: one source image, and an icon that follows the user's DPI.
png = "0.17"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateFileW takes a *const SECURITY_ATTRIBUTES, so the function is gated
    # out of the crate unless Win32_Security is on -- even though nothing here
    # passes anything but a null pointer for it.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # AttachConsole / AllocConsole / SetStdHandle: with windows_subsystem =
    # "windows" the process starts with no standard handles, and these give
    # them back when a terminal launched it.
    "Win32_System_Console",
    # The notification-area icon: a message-only window, its popup menu and
    # Shell_NotifyIconW.
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    # WNDCLASSW carries an hbrBackground: HBRUSH, which lives in Gdi -- so the
    # whole struct is gated out of the crate without this, exactly like
    # CreateFileW is without Win32_Security. Nothing here draws anything.
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rate_tracker"
harness = false

[[bench]]
name = "torrent_to_json"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = false
debug = 1

[profile.release-dbg]
inherits = "release"
strip = false
debug = 2
lto = "off"

[patch.crates-io]
librqbit-dualstack-sockets = { path = "../third_party/librqbit-dualstack-sockets" }
librqbit-dht = { path = "../third_party/librqbit-dht" }
