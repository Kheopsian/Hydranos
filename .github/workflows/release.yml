name: release

on:
  push:
    tags: ["v*"]
  # Manual trigger, so a missed push event can be replayed without touching a
  # published tag. GitHub does not replay triggers it dropped - Actions was in
  # a major outage when v3.44.0 was pushed, and the tag stayed orphaned.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v3.44.0)"
        required: true
        type: string

permissions:
  contents: write

# The tag this run is about. On a tag push it is the pushed tag, which keeps the
# automatic path byte-identical to what it was; on a manual run it is the input.
env:
  REL_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Compute affected platforms + release body
        shell: bash
        run: |
          TAG="${REL_TAG}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then RANGE="$TAG"; else RANGE="${PREV}..${TAG}"; fi
          win=0; lin=0
          while IFS= read -r -d '' msg; do
            w=0; l=0
            printf '%s' "$msg" | grep -qiF '[windows]' && w=1
            printf '%s' "$msg" | grep -qiF '[linux]' && l=1
            if [ "$w" = 1 ] && [ "$l" = 0 ]; then win=1
            elif [ "$l" = 1 ] && [ "$w" = 0 ]; then lin=1
            else win=1; lin=1; fi
          done < <(git log --format='%B%x00' "$RANGE")
          if [ "$win" = 0 ] && [ "$lin" = 0 ]; then win=1; lin=1; fi
          PLATS=""
          [ "$lin" = 1 ] && PLATS="linux"
          [ "$win" = 1 ] && PLATS="${PLATS:+$PLATS, }windows"
          echo "Computed platforms: $PLATS  (range $RANGE)"
          {
            echo "Platforms: $PLATS"
            echo
            echo "Changes in ${RANGE}:"
            git log --format='- %s' "$RANGE"
          } > body.md

      - name: Create/update the release with the platform label
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: body.md

  build:
    needs: meta
    strategy:
      # One architecture failing must not cancel the other: a fail-fast matrix
      # turned a broken arm64 build into a release with no Linux tarball at all.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The engine is built against musl so the tarball is a static binary.
      # Built against the runner's glibc it inherited that glibc's symbol
      # versions (2.34 on ubuntu-24.04) and a dynamic libssl, which made the
      # "bare metal" release unusable on exactly the hosts that want it --
      # seedboxes, which run older distributions. The Go binary was already
      # static via CGO_ENABLED=0; this brings the engine in line.
      #
      # It builds inside Alpine rather than on the runner because Ubuntu's
      # musl-tools is only a spec wrapper around the glibc gcc: jemalloc's
      # configure rejects it on aarch64 ("Don't have atomics implemented on
      # this platform") and the arm64 job died with exit 101. Alpine IS musl,
      # so the C dependencies -- jemalloc, ring, aws-lc -- build as they would
      # natively, and the image is multi-arch so each runner uses its own
      # architecture with no emulation.
      - name: Build Typhon engine
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src/typhon-engine \
            -e RUSTFLAGS="--cfg tokio_unstable" \
            rust:alpine sh -c '
              set -e
              apk add --no-cache build-base musl-dev cmake perl
              cargo build --release --target ${{ matrix.target }} --bin typhon-engine
            '
          # The container writes as root; later steps read as the runner user.
          sudo chown -R "$(id -u):$(id -g)" typhon-engine/target

      - name: Check the engine really is static
        working-directory: typhon-engine
        run: |
          BIN="target/${{ matrix.target }}/release/typhon-engine"
          file "$BIN"
          # A static build resolves no shared objects, so ldd prints no "=>"
          # lines. Matching on that rather than on ldd's wording, which differs
          # between "statically linked" and "not a dynamic executable".
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "::error::the engine links shared libraries; the tarball would not run on older hosts"
            ldd "$BIN" || true
            exit 1
          fi

      - name: Build hydra
        run: CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o hydra ./cmd/hydra

      - name: Package tarball
        run: |
          VER="${REL_TAG}"
          DIR="hydra-${VER}-linux-${{ matrix.arch }}"
          mkdir -p "$DIR"
          cp hydra "$DIR"/hydra
          cp typhon-engine/target/${{ matrix.target }}/release/typhon-engine "$DIR"/hydra-engine
          cp configs/default.toml "$DIR"/default.toml.example
          cp packaging/hydra.service "$DIR"/hydra.service
          cp packaging/install.sh "$DIR"/install.sh
          chmod +x "$DIR"/install.sh
          tar czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            hydra-*-linux-*.tar.gz
            hydra-*-linux-*.tar.gz.sha256

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Typhon engine
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo build --release --bin typhon-engine

      - name: Build hydra
        env:
          CGO_ENABLED: "0"
        # -H windowsgui: link as a GUI-subsystem binary so a double-click
        # does not leave a cmd.exe window on the desktop. The app attaches to
        # the parent console when started from a terminal, and puts an icon in
        # the notification area otherwise.
        run: go build -mod=vendor -ldflags="-s -w -H windowsgui" -o hydra.exe ./cmd/hydra

      - name: Build the updater
        env:
          CGO_ENABLED: "0"
        # Separate binary on purpose: Windows locks a running image, so
        # hydra.exe cannot overwrite itself. Also GUI-subsystem -- it talks to
        # the user through message boxes, and a console window flashing up
        # would undo what -H windowsgui buys us.
        run: go build -mod=vendor -ldflags="-s -w -H windowsgui" -o hydra-update.exe ./cmd/hydra-update

      - name: Package zip
        shell: pwsh
        run: |
          $VER = $env:REL_TAG
          $DIR = "hydra-$VER-windows-amd64"
          New-Item -ItemType Directory -Force -Path $DIR | Out-Null
          Copy-Item hydra.exe "$DIR/hydra.exe"
          Copy-Item typhon-engine/target/release/typhon-engine.exe "$DIR/hydra-engine.exe"
          Copy-Item hydra-update.exe "$DIR/hydra-update.exe"
          Copy-Item packaging/README-windows.md "$DIR/README.md"
          Compress-Archive -Path $DIR -DestinationPath "$DIR.zip"
          $hash = (Get-FileHash "$DIR.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $DIR.zip" | Out-File -Encoding ascii "$DIR.zip.sha256"

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            hydra-*-windows-*.zip
            hydra-*-windows-*.zip.sha256
