[package]
name = "typhon-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "typhon_engine"
path = "src/lib.rs"

[[bin]]
name = "typhon-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = { version = "0.5", optional = true }
lru = "0.12"
dashmap = { version = "6", features = ["raw-api"] }
futures = "0.3"
tokio-socks = "0.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
librqbit-utp = "0.7"
# sha1-ring, not the default sha1-crypto-hash: the latter pulls OpenSSL in as a
# shared library, which made the release tarball unusable on any host whose
# libssl is older than the build runner's. ring compiles in.
librqbit-dht = { version = "5", default-features = false, features = ["sha1-ring"] }
parking_lot = "0.12"
# Durable per-torrent state. "bundled" compiles SQLite in rather than linking
# the system library, for the same reason sha1-ring is preferred over the
# OpenSSL-backed hash above: a release tarball must not depend on whatever
# libsqlite3 happens to be installed on the host.
rusqlite = { version = "0.32", features = ["bundled"] }

# jemalloc (heap profiling of the Linux leak) and nix are Unix-only; the
# system allocator is used on Windows.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "0.5", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.5", features = ["use_std"] }
nix = { version = "0.29", features = ["fs"] }

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rate_tracker"
harness = false

[[bench]]
name = "torrent_to_json"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = false
debug = 1

[profile.release-dbg]
inherits = "release"
strip = false
debug = 2
lto = "off"

[patch.crates-io]
librqbit-dualstack-sockets = { path = "../third_party/librqbit-dualstack-sockets" }
librqbit-dht = { path = "../third_party/librqbit-dht" }
