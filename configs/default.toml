# Hydra Torrent Daemon - Configuration

[daemon]
api_host = "0.0.0.0"
api_port = 8199
# auto-generated on first start when empty
api_key = ""
data_dir = "/config"
create_torrent_folder = false

# ─────────────────────────────────────────────
# RACE SESSION - maximum aggressiveness (hot downloads)
# ─────────────────────────────────────────────
[race]
listen_port = 16171
# While a tracker answers "unregistered torrent" (the upload is not in yet),
# re-announce every 5 seconds for this many minutes; then the tracker's own
# interval. The same bound autobrr applies to qBittorrent.
registration_retry_minutes = 6
# Pin this engine's peer sockets to one host interface (optional), by NAME,
# e.g. "wg0": resolved to its IP at start, so it survives VPN IP changes.
bind_interface = ""
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
# Peer discovery that does not go through a tracker. Both are on by default.
# DHT (BEP 5) asks the global network who else has the torrent; PEX (BEP 11)
# trades peer lists with the peers already connected. Both already skip
# `private` torrents, so a private tracker is never exposed either way. Turn
# them off to make this engine reach nothing but its trackers.
enable_dht = true
enable_pex = true
max_connections = 4000
max_uploads_per_torrent = 100
peer_timeout = 30
inactivity_timeout = 20

# --- Advanced: send this session's tracker announces through a SOCKS5 proxy --
# socks5_outbound_* (if you set it) only covers PEER connections. Announces are
# separate: without the key below they leave directly and the tracker records
# this host's own address, however well the peer traffic is relayed.
# UDP trackers are skipped while this is set (SOCKS5 carries TCP only).
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter. Empty = omit it and
# let the tracker observe the source address (right for almost every setup).
# announce_ip = ""

# ─────────────────────────────────────────────
# HOARD SESSION - upload-optimized (long-term seeding)
# ─────────────────────────────────────────────
[hoard]
listen_port = 16172
# Pin this engine's peer sockets to one host interface (optional), by NAME,
# e.g. "wg0": resolved to its IP at start, so it survives VPN IP changes.
bind_interface = ""
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
# Peer discovery that does not go through a tracker. Both are on by default.
# DHT (BEP 5) asks the global network who else has the torrent; PEX (BEP 11)
# trades peer lists with the peers already connected. Both already skip
# `private` torrents, so a private tracker is never exposed either way. Turn
# them off to make this engine reach nothing but its trackers.
enable_dht = true
enable_pex = true
max_connections = 12000
max_uploads_per_torrent = -1
peer_timeout = 20
inactivity_timeout = 20

active_seeds = -1
active_limit = -1
active_downloads = 10

# --- Advanced: send this session's tracker announces through a SOCKS5 proxy --
# socks5_outbound_* (if you set it) only covers PEER connections. Announces are
# separate: without the key below they leave directly and the tracker records
# this host's own address, however well the peer traffic is relayed.
# UDP trackers are skipped while this is set (SOCKS5 carries TCP only).
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter. Empty = omit it and
# let the tracker observe the source address (right for almost every setup).
# announce_ip = ""

# ─────────────────────────────────────────────
# VPN SPEEDTEST
# ─────────────────────────────────────────────
[vpn_speedtest]
enabled = true
# Public target: measures real peer-facing capacity (against a public iperf3
# server) instead of a VPS loopback that over-estimates.
iperf3_server = "ping.online.net"

# ─────────────────────────────────────────────
# RACE DRAIN - automatic NVMe purge (hand back space)
# ─────────────────────────────────────────────
[race_drain]
enabled = true
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85

# Optional per-tracker announce passkey override (host substring -> passkey).
# Hot-swap via POST /api/announce/passkeys. Ships empty. Set here, it applies to
# this node AND to every agent it drives: the four announce tables are pushed
# fleet-wide, so a passkey is written in one place rather than in each node.
# [announce_passkeys]
# "tracker.example.net" = "your-passkey-here"

[auth]
username = "admin"
# bcrypt hash — generate with: hydra hash-password <password>
password_hash = ""

# ─────────────────────────────────────────────
# EXTRA ENGINES on this machine (optional)
# ─────────────────────────────────────────────
# [race] and [hoard] above are this node's two engines, and the profiles an
# extra engine inherits by role. An extra engine (one per VPN tunnel, say) is
# a block holding only what differs from its role's profile:
#
# [[engine]]
# name = "vpn7"                  # its id, as the UI shows it
# role = "race"                  # "race" or "hoard": the profile it inherits
# [engine.session]
# listen_port = 26991
# bind_interface = "wg7"
#
# Other machines are not declared here: each runs its own Hydranos and joins
# as a node (install.sh --register-to <url> --token <token>; the Nodes page
# gives the full command).
