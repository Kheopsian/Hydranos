[package]
name = "typhon-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "typhon_engine"
path = "src/lib.rs"

[[bin]]
name = "typhon-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = { version = "0.5", optional = true }
lru = "0.12"
nix = { version = "0.29", features = ["fs"] }
dashmap = "6"
futures = "0.3"
tokio-socks = "0.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
librqbit-utp = "0.7"
librqbit-dht = "5"
parking_lot = "0.12"
tikv-jemallocator = { version = "0.5", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.5", features = ["use_std"] }

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rate_tracker"
harness = false

[[bench]]
name = "torrent_to_json"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = false
debug = 1

[profile.release-dbg]
inherits = "release"
strip = false
debug = 2
lto = "off"
