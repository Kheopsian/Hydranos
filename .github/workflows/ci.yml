name: ci

# The check every change goes through, PRs included. The other four workflows
# all fire on a tag, a push to main or a release, so until this file existed a
# pull request arrived with nothing run against it at all -- PR #21 and PR #30
# were both built and tested by hand in a golang container before merging.
#
# Deliberately cheap: build, lint and test, no release artifacts. The expensive
# multi-arch static builds stay in release.yml, where a tag pays for them once.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR that is pushed to twice in a minute does not need the first run to
# finish. main is never cancelled: its runs are the record of what merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leaks:
    # This repository is public and tied to a named account. The check that was
    # missing let a real public IP sit in three files for seven weeks, entered
    # by a commit that was itself fixing a leak.
    #
    # The specific values -- a name, an address, a topic -- are NOT in this
    # repository: they arrive in LEAK_DENYLIST, a repository secret. Writing
    # them into a public workflow would publish exactly what the workflow
    # defends. Without the secret (a fork, an outside pull request) the
    # generic rules still run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Leak guard
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: python3 .github/scripts/leak_guard.py

  # Every action, image and cargo build named by content: see the script.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Self-test the guard
        run: python3 .github/scripts/pin_guard.py --self-test
      - name: Actions, images and cargo builds are pinned
        run: python3 .github/scripts/pin_guard.py

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tags ARE the check: rule 2 compares this branch's version
          # against every version already released. A shallow clone fetches
          # none of them, and the rule would pass by having nothing to compare.
          fetch-depth: 0
          fetch-tags: true
      # The checker is checked first. A guard that silently stopped matching
      # its own regexes would go green on anything, which is worse than not
      # having it: this asserts it still rejects each input it must reject.
      - name: Self-test the guard
        run: python3 .github/scripts/version_guard.py --self-test
      - name: Version, changelog and tags agree
        run: python3 .github/scripts/version_guard.py

  # Known vulnerabilities in the locked dependencies, from the RustSec
  # database as it is on the day of the run: an advisory published tomorrow
  # turns this red with no change here, which is the point. An advisory that
  # cannot reach Hydranos is ignored in typhon-engine/.cargo/audit.toml, with
  # the reason beside it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: typhon-engine
        run: cargo audit

  # entrypoint.sh is the first thing every container runs and it is not covered
  # by any Go test: a syntax error in it turns into a container that exits
  # before hydra is even reached.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse the entrypoint
        run: sh -n entrypoint.sh
      - name: Shellcheck
        run: |
          shellcheck -s sh entrypoint.sh
          shellcheck tools/interop/run.sh
          shellcheck -s sh packaging/install.sh packaging/test-install.sh
          shellcheck -s sh install.sh packaging/test-enrol.sh
          shellcheck -s sh packaging/test-unit.sh packaging/test-entrypoint.sh packaging/test-options.sh
      - name: Bare-metal installer, run as root in a container
        run: sh packaging/test-install.sh
      - name: Node enrolment script, against a stand-in controller
        run: sh packaging/test-enrol.sh
      - name: systemd unit sandboxing, rated by systemd-analyze
        run: sh packaging/test-unit.sh
      - name: Container entrypoint, who the daemon runs as
        run: sh packaging/test-entrypoint.sh
      - name: Install options (--harden, --listen) and the heap-profile switch
        run: sh packaging/test-options.sh

  # The conformance suite in `rust` checks the client against OUR reading of
  # the BEPs, on trackers we wrote for the purpose. This checks it against
  # software somebody else wrote: opentracker, Torrust in private mode, and
  # qBittorrent/libtorrent moving real pieces both ways, encrypted and not.
  # What each test asserts is read back from the other side's own state.
  # See docs/BITTORRENT-CONFORMANCE.md, "Interoperability".
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: opentracker, Torrust (private) and libtorrent
        run: tools/interop/run.sh

  # The one check that needs a real kernel: bringing a WireGuard tunnel up and
  # proving the host's own routing is untouched by it.
  #
  # Everything else about this feature is asserted against the PLAN -- what the
  # code says it will run. That catches a wrong table number; it cannot catch
  # the plan being right and the effect being wrong. And the failure it guards
  # against is not a broken test suite, it is a machine that silently moves its
  # whole egress into a VPN, which has no undo.
  #
  # No container and no capability juggling: the hosted runner is a VM with
  # passwordless sudo, so the test simply runs as root. No provider is
  # involved: the test builds two network namespaces and plays the provider
  # in the second, so the handshake is real and the host is never touched.
  wireguard:
    # This built ./internal/wgtun (Go) and the Go tree is gone. The tunnel was
    # ported -- typhon-engine/src/hydra/wgtun.rs, with its own tests -- so the
    # job follows it rather than disappearing with the language.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: typhon-engine
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends wireguard-tools iproute2
      # Built unprivileged and only RUN as root: a `sudo cargo test` would hand
      # root a toolchain and a registry cache for one syscall's worth of
      # privilege.
      - name: Build the test binary
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: |
          cargo test --release --locked --bin hydranos --no-run --message-format=json \
            | python3 -c "import json,sys;print([json.loads(l)['executable'] for l in sys.stdin if l.strip().startswith('{') and json.loads(l).get('executable')][-1])" \
            > /tmp/wgtun-test-path
          cp "$(cat /tmp/wgtun-test-path)" ../wgtun.test
      # Ubuntu 26.04 ships an AppArmor profile for /usr/bin/wg, in enforce mode,
      # that refuses `wg set private-key <file>` the open of the key (kernel:
      # apparmor="DENIED" profile="wg", strace: EACCES), in a 0700 directory
      # and by /dev/stdin alike. The test writes its key under /tmp, where the
      # profile does not let wg read. Complain mode keeps the profile loaded and
      # logs instead of refusing; the runner is a throwaway VM and only this job
      # is touched, never the engine.
      - name: Let wg read the test key (AppArmor complain mode)
        run: |
          if command -v aa-complain >/dev/null 2>&1; then
            sudo aa-complain /usr/bin/wg
          elif [ -f /etc/apparmor.d/wg ]; then
            sudo apparmor_parser -R /etc/apparmor.d/wg
          else
            echo "no wg AppArmor profile to relax"
          fi
      # --ignored: the root test is #[ignore] so an unprivileged `cargo test`
      # skips it. Without the flag this step ran zero tests and passed.
      - name: Bring a tunnel up for real
        run: sudo HYDRANOS_WG_ROOT_TEST=1 ./wgtun.test --test-threads=1 --ignored wgtunnel::root
      # The step above started failing with `fopen: Permission denied` from
      # `wg set private-key`, on a path that is not ours (a fresh 0700 directory
      # fails the same). Say what the runner is, once, instead of guessing.
      - name: Why wg could not read the key
        if: failure()
        run: |
          set +e
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          sudo sysctl fs.protected_regular fs.protected_symlinks kernel.apparmor_restrict_unprivileged_userns
          command -v wg && wg --version && ls -l "$(command -v wg)" && readlink -f "$(command -v wg)"
          sudo aa-status 2>&1 | head -30
          cat /etc/apparmor.d/wg 2>&1 | head -60
          sudo sh -c '
            d=$(mktemp -d); wg genkey > "$d/k"; ls -ld "$d"; ls -l "$d/k"
            ip netns add dbg && ip -n dbg link add wgp type wireguard
            ip netns exec dbg ls -l "$d/k"
            ip netns exec dbg wc -c < "$d/k"
            ip netns exec dbg wg set wgp private-key "$d/k"; echo "wg set: $?"
            wg set wgp private-key "$d/k" 2>&1 | head -2
            # The same key, by stdin instead of a file: if this one works the
            # job has a way round whatever refuses the file.
            ip netns exec dbg wg set wgp private-key /dev/stdin < "$d/k"; echo "wg set by stdin: $?"
            command -v strace >/dev/null || apt-get install -y --no-install-recommends strace >/dev/null 2>&1
            strace -f -e trace=openat -o /tmp/wg.strace ip netns exec dbg wg set wgp private-key "$d/k"
            grep -E "EACCES|EPERM" /tmp/wg.strace | head
            ip netns del dbg; rm -rf "$d"
          '
          # dmesg may be refused to the runner user: say so instead of printing nothing.
          if out=$(sudo dmesg 2>&1); then
            echo "$out" | grep -i -E 'apparmor|denied|wg' | tail -10
            [ -n "$out" ] || echo "dmesg: empty"
          else
            echo "dmesg: refused: $out"
          fi
          sudo journalctl -k --no-pager 2>&1 | grep -i -E 'apparmor|denied|wg' | tail -10
          cat /proc/self/attr/current 2>&1

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # jemalloc and aws-lc build C: the hosted image ships cmake, but naming
      # the dependency here means a runner image that drops it fails on this
      # line instead of somewhere inside a five-minute compile.
      - name: Build dependencies
        run: sudo apt-get install -y --no-install-recommends cmake
      # Keyed on the lockfile: a dependency change gets a cold build, everything
      # else reuses the last one. Without it a PR touching one Rust line pays
      # for jemalloc, ring and aws-lc every time.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            typhon-engine/target
          # v2: the v1 cache carried the instrumented build of a removed
          # binary, which `cargo clean -p` does not reach (it only knows the
          # targets the package still declares). Bump it when a target goes.
          key: cargo-v2-${{ runner.os }}-${{ hashFiles('typhon-engine/Cargo.lock') }}
          restore-keys: cargo-v2-${{ runner.os }}-
      # Same cfg release.yml builds with: the engine uses tokio's unstable
      # runtime metrics, and without it the code behind that cfg is never
      # compiled here -- so CI would miss exactly what ships.
      # Default rustfmt options, no rustfmt.toml: the whole crate is formatted,
      # so a diff that is not is the author's to fix with `cargo fmt`.
      - name: Format
        working-directory: typhon-engine
        run: cargo fmt --check
      - name: Check
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo check --locked --all-targets
      # Same cfg and same targets as Check, so the code behind tokio_unstable and
      # the tests are linted too. A lint that is wrong for one line gets a local
      # #[allow(...)] with its reason, not a crate-wide one.
      - name: Clippy
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo test --locked
      # Coverage, as a ratchet rather than a target.
      #
      # Chasing a percentage produces tests written for the metric. What this
      # guards is narrower and worth more: a change cannot arrive with less
      # covered than what is already there. The V4 port shipped whole
      # subsystems -- NAT-PMP among them -- with no call site and no test, and
      # nothing anywhere said so.
      #
      # Installed rather than pulled from a third-party action: this is a
      # public repository, and `--locked` from crates.io is one less thing
      # taking someone's word for it. The cache makes it a one-off.
      - name: Install cargo-llvm-cov
        run: |
          command -v cargo-llvm-cov >/dev/null 2>&1 \
            || cargo install cargo-llvm-cov --locked
          rustup component add llvm-tools-preview
      - name: Coverage does not go down
        working-directory: typhon-engine
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: |
          floor=$(grep -v '^#' .coverage-floor | tr -d '[:space:]')
          # Read from the JSON rather than the table: the human-readable one
          # puts region, function and line coverage in three columns of the
          # same shape, and picking the wrong one reads a number that is right
          # about something else.
          # The cached target still holds the instrumented binary of a target
          # since removed (src/main.rs); measured with the rest, it counted
          # 7 900 lines no build compiles any more. Clean the workspace's
          # coverage artifacts first, so only what this tree builds is measured.
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --summary-only --json --output-path cov.json
          pct=$(python3 -c "import json;print(json.load(open('cov.json'))['data'][0]['totals']['lines']['percent'])")
          echo "line coverage: $pct%  (floor $floor%)"
          # The run's logs need an account to read; its annotations do not.
          # These say what was measured, so a number that differs from a
          # local run can be traced to the tool, the line count or the files.
          echo "::notice::$(cargo llvm-cov --version) / $(rustc --version)"
          python3 - <<'PY'
          import json
          d = json.load(open("cov.json"))["data"][0]
          t = d["totals"]["lines"]
          print(f"::notice::lines {t['covered']}/{t['count']} covered")
          # Every file, so that a local run can be subtracted from it file by
          # file. A step keeps ten notices and a long one may be cut, so the
          # list goes out in numbered parts of under 3 000 characters.
          rows = sorted(
              f"{f['filename'].split('typhon-engine/')[-1]}:{f['summary']['lines']['covered']}/{f['summary']['lines']['count']}"
              for f in d["files"])
          parts, cur = [], ""
          for r in rows:
              if cur and len(cur) + len(r) + 1 > 3000:
                  parts.append(cur)
                  cur = ""
              cur = f"{cur};{r}" if cur else r
          parts.append(cur)
          for i, p in enumerate(parts, 1):
              print(f"::notice::files {i}/{len(parts)} {p}")
          PY
          python3 - "$pct" "$floor" <<'PY'
          import sys
          pct, floor = float(sys.argv[1]), float(sys.argv[2])
          if pct + 1e-9 < floor:
              print(f"::error::line coverage {pct:.2f}% is below the floor of {floor:.2f}%")
              print("::error::add tests for what this change touches, or say in the commit why the floor moves")
              sys.exit(1)
          if pct >= floor + 2:
              print(f"::notice::coverage is {pct:.2f}%, comfortably above {floor:.2f}% -- raise .coverage-floor")
          PY
