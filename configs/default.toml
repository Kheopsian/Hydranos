# Hydra Torrent Daemon - Configuration

[daemon]
api_host = "0.0.0.0"
api_port = 8199
# auto-generated on first start when empty
api_key = ""
data_dir = "/config"
create_torrent_folder = false
# where the daemon's own requests (tracker lists, IP filter lists, update check, webhooks, .torrent URLs) go:
#   "auto"        follow the network mode (default): direct in direct mode and
#                 inside gluetun; behind SOCKS5 / PROXY v2 the proxy of the race
#                 engine, else of the first engine that has one; in WireGuard
#                 mode the tunnel of the race engine, else of the first
#                 tunnelled one
#   "direct"      the host's default route (bound to bind_interface below if set)
#   "proxy"       the [proxy] section below
#   "engine:<id>" the same way out as that engine: its tunnel, interface or proxy
# With the kill switch armed, a way out that is missing or unusable REFUSES the
# request; it is never sent by the default route instead.
# egress = "auto"
# Interface the daemon's own requests are bound to when they go "direct" or
# through "proxy". The engines have their own, in [race]/[hoard].
# bind_interface = "wg0"
# Kill switch. Absent = follows the network mode: off in direct mode, ON in
# every other (socks5, proxy_v2, wireguard, gluetun). Armed, an engine with no
# tunnel, no interface and no proxy is BLOCKED -- never put on the network,
# said at startup, on the Network tab and as `degraded` on /health -- unless
# its section says `allow_direct = true`; and the daemon's requests are
# refused when their way out is not usable.
#   false  disarm it: leaks accepted knowingly, every engine runs
#   true   arm it even in direct mode: nothing without a way out leaves
# kill_switch = false

# SOCKS5 proxy for the daemon's own requests with egress = "proxy" (socks5h:
# names are resolved by the proxy). The engines' proxy is socks5_outbound_* in
# [race]/[hoard].
# [proxy]
# socks5_host = "10.0.0.1"
# socks5_port = 1080
# socks5_user = ""
# socks5_pass = ""

# ─────────────────────────────────────────────
# RACE SESSION - maximum aggressiveness (hot downloads)
# ─────────────────────────────────────────────
[race]
listen_port = 16171
# While a tracker answers "unregistered torrent" (the upload is not in yet),
# re-announce every 5 seconds for this many minutes; then the tracker's own
# interval. The same bound autobrr applies to qBittorrent.
registration_retry_minutes = 6
# Pin this engine's peer sockets to one host interface (optional), by NAME,
# e.g. "wg0": resolved to its IP at start, so it survives VPN IP changes.
bind_interface = ""
# This engine leaves by the host's default route ON PURPOSE. With the kill
# switch armed (any network mode but direct), an engine with no tunnel, no
# interface and no proxy is blocked unless this is true. In WireGuard mode it
# is the "Direct (default interface)" choice of the Network tab. An extra
# [[engine]] does not inherit it from its role.
# allow_direct = false
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
# Peer discovery that does not go through a tracker. Both are on by default.
# DHT (BEP 5) asks the global network who else has the torrent; PEX (BEP 11)
# trades peer lists with the peers already connected. Both already skip
# `private` torrents, so a private tracker is never exposed either way. Turn
# them off to make this engine reach nothing but its trackers.
enable_dht = true
enable_pex = true
# Local Service Discovery (BEP 14): announce the torrents this engine is
# downloading, or has peers for, to the LAN by multicast, and take the LAN
# peers announcing the same ones. At most one ~1 KB datagram a second whatever
# the size of the library; never a `private` torrent; off behind a SOCKS5
# proxy. On by default for race, as in qBittorrent.
enable_lsd = true
max_connections = 4000
# Speed caps for this engine, in BYTES per second. 0 = unlimited. Applied live
# when saved. A torrent can carry its own cap on top (right-click > Limit rate).
upload_rate_limit = 0
download_rate_limit = 0
# The choker: keep only `max_uploads_per_torrent` peers unchoked per seeding
# torrent, re-ranked every 10 s. OFF by default, and leave it off unless the
# uplink itself is the bottleneck: on a large library it churns the peers and
# can cut total upload by an order of magnitude (it was removed for that in
# 2.4.13). -1 slots = unlimited.
choking = false
max_uploads_per_torrent = 100
# Seconds a peer may send nothing useful (keep-alives do not count) before it
# is dropped. Under 120 is raised to 120.
peer_timeout = 300
inactivity_timeout = 20

# The queue, qBittorrent's. active_downloads (0 or -1 = unlimited) always
# applies; active_seeds and active_limit (downloads + seeds) only with
# queueing = true, -1 = unlimited. Read live, no restart.
queueing = false
active_seeds = -1
active_limit = -1
# Share limits, qBittorrent's: a seed that reaches ANY of them is stopped, or
# removed (share_limit_action = "stop" | "remove" | "remove_with_files").
# -1 = off; times in minutes. A torrent can carry its own (setShareLimits,
# right-click > Share limits). Never before the tracker's minimum: a seed whose
# tracker has no announce_min_seed_hours, or has not served it, is left alone.
max_ratio = -1.0
max_seeding_time = -1
max_inactive_seeding_time = -1
share_limit_action = "stop"

# --- Advanced: proxy and relay (the Network tab writes these as one set) ----
# Every outbound PEER connection through a SOCKS5 proxy, v4 and v6 alike. A dial
# the proxy refuses is dropped, never retried directly, and outbound uTP is off
# (SOCKS5 cannot carry UDP). DHT stays plain UDP: turn it off above if this
# host's address must stay hidden from DHT nodes.
# socks5_outbound_host = "10.0.0.1"
# socks5_outbound_port = 1080
# socks5_outbound_user = ""
# socks5_outbound_pass = ""
#
# Tracker announces and webseed fetches go through the SOCKS5 proxy above
# (socks5h: the tracker's name is resolved by the proxy). Set this only to send
# them another way. UDP trackers are NOT announced while a proxy is in use.
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter (and the BEP-15 `ip`
# field, IPv4 only). Empty = omit it and let the tracker observe the source
# address (right for almost every setup).
# announce_ip = ""
#
# Incoming peers forwarded by a relay (haproxy...) with a PROXY-v2 header that
# carries their real address. 0 = no such listener. Loopback and private ranges
# are always trusted as the relay; list a public relay explicitly.
# listen_port_proxy_v2 = 0
# listen_addr_proxy_v2 = ""
# proxy_v2_trusted_sources = []

# ─────────────────────────────────────────────
# HOARD SESSION - upload-optimized (long-term seeding)
# ─────────────────────────────────────────────
[hoard]
listen_port = 16172
# Pin this engine's peer sockets to one host interface (optional), by NAME,
# e.g. "wg0": resolved to its IP at start, so it survives VPN IP changes.
bind_interface = ""
# This engine leaves by the host's default route ON PURPOSE. With the kill
# switch armed (any network mode but direct), an engine with no tunnel, no
# interface and no proxy is blocked unless this is true. In WireGuard mode it
# is the "Direct (default interface)" choice of the Network tab. An extra
# [[engine]] does not inherit it from its role.
# allow_direct = false
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
# Peer discovery that does not go through a tracker. Both are on by default.
# DHT (BEP 5) asks the global network who else has the torrent; PEX (BEP 11)
# trades peer lists with the peers already connected. Both already skip
# `private` torrents, so a private tracker is never exposed either way. Turn
# them off to make this engine reach nothing but its trackers.
enable_dht = true
enable_pex = true
# Local Service Discovery (see [race]). Off by default here: a seedbox of
# mostly private torrents downloads little and LSD never announces those.
enable_lsd = false
max_connections = 12000
# Speed caps, bytes/s, 0 = unlimited (see [race]).
upload_rate_limit = 0
download_rate_limit = 0
# The choker, off: a seedbox wants every interested peer served (see [race]).
choking = false
max_uploads_per_torrent = -1
peer_timeout = 300
inactivity_timeout = 20

# The queue (see [race]); 10 downloads at a time, seeds unlimited.
active_downloads = 10
queueing = false
active_seeds = -1
active_limit = -1
# Share limits (see [race]), off.
max_ratio = -1.0
max_seeding_time = -1
max_inactive_seeding_time = -1
share_limit_action = "stop"

# --- Advanced: proxy and relay (the Network tab writes these as one set) ----
# Every outbound PEER connection through a SOCKS5 proxy, v4 and v6 alike. A dial
# the proxy refuses is dropped, never retried directly, and outbound uTP is off
# (SOCKS5 cannot carry UDP). DHT stays plain UDP: turn it off above if this
# host's address must stay hidden from DHT nodes.
# socks5_outbound_host = "10.0.0.1"
# socks5_outbound_port = 1080
# socks5_outbound_user = ""
# socks5_outbound_pass = ""
#
# Tracker announces and webseed fetches go through the SOCKS5 proxy above
# (socks5h: the tracker's name is resolved by the proxy). Set this only to send
# them another way. UDP trackers are NOT announced while a proxy is in use.
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter (and the BEP-15 `ip`
# field, IPv4 only). Empty = omit it and let the tracker observe the source
# address (right for almost every setup).
# announce_ip = ""
#
# Incoming peers forwarded by a relay (haproxy...) with a PROXY-v2 header that
# carries their real address. 0 = no such listener. Loopback and private ranges
# are always trusted as the relay; list a public relay explicitly.
# listen_port_proxy_v2 = 0
# listen_addr_proxy_v2 = ""
# proxy_v2_trusted_sources = []

# ─────────────────────────────────────────────
# VPN SPEEDTEST
# ─────────────────────────────────────────────
[vpn_speedtest]
enabled = true
# Public target: measures real peer-facing capacity (against a public iperf3
# server) instead of a VPS loopback that over-estimates.
iperf3_server = "ping.online.net"

# ─────────────────────────────────────────────
# RACE DRAIN - automatic NVMe purge (hand back space)
# ─────────────────────────────────────────────
[race_drain]
enabled = true
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85

# Optional per-tracker announce passkey override (host substring -> passkey).
# Hot-swap via POST /api/announce/passkeys. Ships empty. Set here, it applies to
# this node AND to every agent it drives: the four announce tables are pushed
# fleet-wide, so a passkey is written in one place rather than in each node.
# [announce_passkeys]
# "tracker.example.net" = "your-passkey-here"

[auth]
username = "admin"
# bcrypt hash — generate with: hydra hash-password <password>
password_hash = ""

# ─────────────────────────────────────────────
# EXTRA ENGINES on this machine (optional)
# ─────────────────────────────────────────────
# [race] and [hoard] above are this node's two engines, and the profiles an
# extra engine inherits by role. An extra engine (one per VPN tunnel, say) is
# a block holding only what differs from its role's profile:
#
# [[engine]]
# name = "vpn7"                  # its id, as the UI shows it
# role = "race"                  # "race" or "hoard": the profile it inherits
# [engine.session]
# listen_port = 26991
# bind_interface = "wg7"
#
# Other machines are not declared here: each runs its own Hydranos and joins
# as a node (install.sh --register-to <url> --token <token>; the Nodes page
# gives the full command).
