# Hydra Torrent Daemon - Configuration

[daemon]
api_host = "0.0.0.0"
api_port = 8199
# auto-generated on first start when empty
api_key = ""
# Shared bearer token the HydraAgent gRPC data-plane requires from a front
# (--agent-addr / --agent-only). Empty = no auth: fine on a private LAN, not
# fine anywhere else. Overridden by $HYDRA_AGENT_TOKEN, then by --agent-token.
agent_token = ""
data_dir = "/config"
create_torrent_folder = false

# ─────────────────────────────────────────────
# RACE SESSION - maximum aggressiveness (hot downloads)
# ─────────────────────────────────────────────
[race]
listen_port = 16171
# Pin this engine's peer sockets to one host interface (optional).
#   bind_interface    = "wg0"          # by NAME, resolved to its IP at start (survives VPN IP changes)
#   listen_interfaces = "10.0.0.2:PORT" # by IP (advanced; comma-separated for multi-home)
bind_interface = ""
listen_interfaces = ""
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
max_connections = 4000
max_uploads_per_torrent = 100
peer_timeout = 30
inactivity_timeout = 20

# --- Advanced: send this session's tracker announces through a SOCKS5 proxy --
# socks5_outbound_* (if you set it) only covers PEER connections. Announces are
# separate: without the key below they leave directly and the tracker records
# this host's own address, however well the peer traffic is relayed.
# UDP trackers are skipped while this is set (SOCKS5 carries TCP only).
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter. Empty = omit it and
# let the tracker observe the source address (right for almost every setup).
# announce_ip = ""


[race.custom_choking]
enabled = true
tick_interval_seconds = 2
strategy = "rarity_captive"
max_unchoked = 30
rarity_weight = 0.7
speed_weight = 0.3

# ─────────────────────────────────────────────
# HOARD SESSION - upload-optimized (long-term seeding)
# ─────────────────────────────────────────────
[hoard]
listen_port = 16172
# Pin this engine's peer sockets to one host interface (optional).
#   bind_interface    = "wg0"          # by NAME, resolved to its IP at start (survives VPN IP changes)
#   listen_interfaces = "10.0.0.2:PORT" # by IP (advanced; comma-separated for multi-home)
bind_interface = ""
listen_interfaces = ""
# Also listen for peers over IPv6, and accept the IPv6 peers trackers and PEX
# offer. Off = IPv4 only, which is the long-standing behaviour. Only turn it on
# if this host really has working IPv6 connectivity.
enable_ipv6 = false
max_connections = 12000
max_uploads_per_torrent = -1
peer_timeout = 20
inactivity_timeout = 20

active_seeds = -1
active_limit = -1
active_downloads = 10

# --- Advanced: send this session's tracker announces through a SOCKS5 proxy --
# socks5_outbound_* (if you set it) only covers PEER connections. Announces are
# separate: without the key below they leave directly and the tracker records
# this host's own address, however well the peer traffic is relayed.
# UDP trackers are skipped while this is set (SOCKS5 carries TCP only).
# announce_proxy = "socks5h://user:pass@10.0.0.1:1080"
#
# Address advertised in the BEP-7 `ip=` announce parameter. Empty = omit it and
# let the tracker observe the source address (right for almost every setup).
# announce_ip = ""

# ─────────────────────────────────────────────
# BENCH / TELEMETRY DB (bench.db)
# ─────────────────────────────────────────────
# race_snapshots holds one row per racing torrent per sampling tick, so it
# outgrows every other table by orders of magnitude and gets its own, much
# shorter retention window. Every key below is optional; the defaults shown
# are what applies when the section is absent.
[bench]
# false stops all bench recording (samples, race snapshots, events, tracker
# samples). Retention keeps running so an existing file still shrinks.
enabled = true
# Window for the low-rate tables (bench_samples, vpn_speedtest, race_events,
# tracker_samples). 0 = 365. Negative = never prune.
retention_days = 365
# Window for race_snapshots. 0 = 7. Negative = never prune.
race_snapshot_retention_days = 7
# Race sampling cadence in seconds. 0 = 5.
snapshot_interval_secs = 5
# How often retention runs, in minutes. 0 = 60. A prune also runs at boot.
prune_interval_mins = 60
# Reclaim the file after a prune that deleted rows. Off by default: VACUUM
# rewrites the whole database and needs as much free space again.
vacuum = false

# ─────────────────────────────────────────────
# VPN SPEEDTEST
# ─────────────────────────────────────────────
[vpn_speedtest]
enabled = true
# Public target: measures real peer-facing capacity (against a public iperf3
# server) instead of a VPS loopback that over-estimates. The code auto-retries
# on basePort..+8 when the server is busy.
iperf3_server = "ping.online.net"
iperf3_port = 5201
interval_secs = 3600
duration_secs = 10

# ─────────────────────────────────────────────
# RACE DRAIN - automatic NVMe purge (hand back space)
# ─────────────────────────────────────────────
[race_drain]
enabled = true
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85
race_path = "/race"
min_age_minutes = 10

# Optional per-tracker announce passkey override (host substring -> passkey).
# Hot-swap via POST /api/announce/passkeys. Ships empty. Set here, it applies to
# this node AND to every agent it drives: the four announce tables are pushed
# fleet-wide, so a passkey is written in one place rather than in each node.
# [announce_passkeys]
# "tracker.example.net" = "your-passkey-here"

[auth]
username = "admin"
# bcrypt hash — generate with: hydra hash-password <password>
password_hash = ""

# ─────────────────────────────────────────────
# AGENTS - remote nodes this instance configures and drives
# ─────────────────────────────────────────────
# An agent (started with --agent-only) knows only its own identity: for each
# engine an id, a role, a listen port and whether IPv6 is on, given through
# --engine or $HYDRA_ENGINE_ID / $HYDRA_ENGINE_ROLE / $HYDRA_ENGINE_LISTEN_PORT
# / $HYDRA_ENGINE_ENABLE_IPV6. It needs no config file of its own. Everything
# else is composed here and pushed to it over the gRPC channel: [race] and
# [hoard] above double as the FLEET PROFILES for remote engines of that role.
#
# listen_port and enable_ipv6 are never taken from here for a remote engine.
# They describe the agent's own machine, and the agent reapplies its own values
# over whatever arrives.
#
# [[agent]]
# name  = "de-1"                 # how this node is named in the UI
# addr  = "10.0.0.5:9090"        # its --agent-addr, reachable from here
# token = ""                     # must match the agent's $HYDRA_AGENT_TOKEN
# tls_ca = ""                    # path to the CA cert when the agent serves TLS
#
# A sparse exception to the role profile, for one engine, keyed by the id the
# agent declares. Only the keys written here are overridden.
#   [[agent.engine]]
#   id = "race-0"
#   announce_proxy = "socks5h://user:pass@127.0.0.1:1080"

# --- Advanced: per-disk seed-slot regulation (HDD quiet mode) ---------------
# Off by default. Bounds concurrent active uploaders per disk so spinning
# drives stay quiet. Uncomment and list your disks (Windows drive letters).
# type="ssd" = never capped. Only listed disks are regulated.
# [hoard.disk_slots]
# enabled = true
# default_max_active = 10
# [[hoard.disk_slots.disk]]
# key = "D:"
# type = "hdd"
# max_active = 10
# wake_below = 5
# [[hoard.disk_slots.disk]]
# key = "C:"
# type = "ssd"
