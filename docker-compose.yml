# One Hydranos with the prebuilt image.
# The first start seeds a default config into ./config. Open
# http://localhost:8199 and create the admin account on the first-run screen
# (it answers callers on this machine or a private network only).
services:
  hydranos:
    image: ghcr.io/kheopsian/hydranos:latest
    container_name: hydranos
    restart: unless-stopped
    # Shutdown budget. On SIGTERM Hydranos tells the trackers it is leaving
    # (5 s at most), then flushes every engine's resume data in parallel within
    # HYDRANOS_STOP_TIMEOUT (120 s by default). Docker's own default is 10 s,
    # which would SIGKILL mid-flush and leave the resume data stale, so a
    # restart re-checks pieces that were already done. Keep this above
    # HYDRANOS_STOP_TIMEOUT + 5 s.
    stop_grace_period: 150s
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    # Network mode "WireGuard, managed by Hydranos": Hydranos creates one
    # tunnel per engine (wg-<engine>), with its own routing table, and needs
    # NET_ADMIN for that. Without it the mode is refused with this reason.
    # The host's default route is never changed. Keep both IPv4 and IPv6 of a
    # dual-stack provider file with the sysctl (Docker defaults new
    # interfaces to IPv6 off, and it cannot be changed from inside).
    # With PUID/PGID below, also set HYDRANOS_CAP_NET_ADMIN: 1.
    # cap_add:
    #   - NET_ADMIN
    # sysctls:
    #   net.ipv6.conf.default.disable_ipv6: 0
    # Hardening, off by default so the file works as is. Checked together with
    # PUID/PGID below: the entrypoint needs only these five capabilities to
    # hand the files to your user and drop to it. Not checked with managed
    # WireGuard; with it, NET_ADMIN goes into this same cap_add list.
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop: [ALL]
    # cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    # A memory ceiling. Hydranos reads it from its cgroup and sizes its piece
    # buffers to an eighth of it (piece_memory_mb = 0).
    # mem_limit: 8g
    # pids_limit: 4096
    ports:
      # "127.0.0.1:8199:8199" keeps the UI and API to this machine (a reverse
      # proxy in front, say); the BitTorrent ports below must stay reachable.
      - "8199:8199"          # web UI + REST API
      - "16171:16171/tcp"    # race engine BT listen
      - "16171:16171/udp"    # race uTP
      - "16172:16172/tcp"    # hoard engine BT listen
      - "16172:16172/udp"    # hoard uTP
    # The user the daemon runs as: 1000:1000 when unset. Set your own so the
    # downloads are yours; PUID: 0 keeps root, as before 4.5.
    # environment:
    #   PUID: 1000
    #   PGID: 1000
    #   # Shutdown flush budget (120 s by default): 120, 90s, 2m or 1m30s.
    #   # Raise it, and stop_grace_period above with it, for several hundred
    #   # thousand torrents. A value it cannot read is logged and ignored.
    #   HYDRANOS_STOP_TIMEOUT: 120
    #   # Log to the console only (`docker logs hydranos`), with no
    #   # /config/hydranos.log. Set to any value to turn it on.
    #   HYDRANOS_LOG_STDOUT: 1
    # /config/hydranos.log rotates itself at 128 MiB, four old files kept.
    # Nothing rotates Docker's json-file driver unless you say so, and this is
    # a busy instance logs a lot. Same ceiling here.
    logging:
      driver: json-file
      options:
        max-size: "128m"
        max-file: "5"
    volumes:
      - ./config:/config    # config, resume data, SQLite store (persistent)
      - ./data:/data         # torrent payload data
