[package]
name = "hydranos-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, deliberately: typhon-engine's Cargo.lock and its
# `cargo test` / `cargo llvm-cov` must never see libfuzzer-sys. See README.md.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
typhon-engine = { path = "../typhon-engine" }

# The same patches as typhon-engine/Cargo.toml: a [patch] only counts in the
# root manifest of the workspace being built, so it has to be repeated here.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "../third_party/librqbit-dualstack-sockets" }
librqbit-dht = { path = "../third_party/librqbit-dht" }

[profile.release]
debug = 1

[[bin]]
name = "bencode_decode"
path = "fuzz_targets/bencode_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bencode_decode_prefix"
path = "fuzz_targets/bencode_decode_prefix.rs"
test = false
doc = false
bench = false

