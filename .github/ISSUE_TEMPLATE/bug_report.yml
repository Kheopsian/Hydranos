name: Bug report
description: Something in Hydra does not behave the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The fields below exist
        because Hydra spans a Go control plane, a Rust engine and a
        qBittorrent-compatible shim: knowing which one you were talking to
        usually cuts the search in half.

        Only the first few fields are required. Fill in what you can and
        leave the rest empty — we can always ask in a comment.

  - type: input
    id: version
    attributes:
      label: Hydra version
      description: Run `hydra -version`, or `curl localhost:PORT/health`. Include the image tag if you run Docker.
      placeholder: "3.43.0-typhon (ghcr.io/kheopsian/hydra:3.43.0)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run Hydra?
      options:
        - Docker (docker-compose.yml from the repo)
        - Docker (custom compose / Unraid / other orchestrator)
        - Bare binary
        - Built from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface shows the problem?
      description: If a third-party tool is involved, pick the qBittorrent shim.
      multiple: true
      options:
        - Web UI
        - Native REST API (/api/*)
        - qBittorrent shim (/api/v2/*)
        - Engine / transfer behaviour (speed, peers, stalling)
        - Startup, persistence or state restore
        - Agents / distributed setup
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact request if it is an API issue (curl with the header redacted is ideal).
      placeholder: |
        1. Add a torrent whose data is already on disk
        2. ...
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Third-party client involved
      description: Leave empty if none. Include its version.
      placeholder: "autobrr 1.63.0, Sonarr 4.0.15, cross-seed 6.12"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Hydra logs around the failure, and the Typhon engine lines if the
        problem is transfer-related. Redact API keys, tracker passkeys and
        announce URLs before pasting.
      render: text

  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: "Unraid 7.0 / x86_64"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Mostly useful for transfer and storage problems. Two things help:
        the filesystem behind your save paths, and how your traffic leaves
        the box (direct, SOCKS5, PROXY-v2 relay, gluetun).


        Not sure about the filesystem? Run `df -T /path/to/your/save/dir`.
        On Unraid, point it at the pool rather than the share — `/mnt/user`
        reports `shfs`, which hides what is actually underneath, so use
        `df -T /mnt/cache/...` (and `zfs list` if you are on ZFS).
      placeholder: |
        save paths on ZFS (/mnt/cache), gluetun with port rebind

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant part of your config, secrets removed.
      render: toml
