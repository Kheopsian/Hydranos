# Minimal single-node (monolith) Hydra using the prebuilt image.
# First start seeds a default config into ./config and generates an admin login.
# Log in at http://localhost:8199 with user "admin" and the temporary password:
#   docker compose logs hydra | grep "temporary admin password"
services:
  hydra:
    image: ghcr.io/kheopsian/hydra:latest
    container_name: hydra
    restart: unless-stopped
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    ports:
      - "8199:8199"          # web UI + REST API
      - "16171:16171/tcp"    # race engine BT listen
      - "16171:16171/udp"    # race uTP
      - "16172:16172/tcp"    # hoard engine BT listen
      - "16172:16172/udp"    # hoard uTP
    volumes:
      - ./config:/config    # config, resume data, SQLite store (persistent)
      - ./data:/data         # torrent payload data
